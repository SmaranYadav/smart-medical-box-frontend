
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medico | Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="brand"><span>💊</span> Medico.</div>
        <h1>Create account</h1>
        <p class="subtitle">Start managing your medicines safely.</p>

        <form id="registerForm">
            <label>Full name</label>
            <input type="text" id="full_name" placeholder="Enter your full name" required>

            <label>Email address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label>Mobile number</label>
            <input type="tel" id="mobile_number" placeholder="Enter your mobile number"
                   pattern="[0-9+() -]{7,20}" required>

            <label>Password</label>
            <input type="password" id="password" placeholder="Minimum 8 characters"
                   minlength="8" required>

            <button type="submit" id="registerBtn">Create account</button>
            <p id="message" role="status"></p>
        </form>

        <p class="switch">
            Already registered? <a href="index.html">Login</a>
        </p>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
